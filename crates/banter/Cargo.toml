[package]
name = "banter"
description = "Tiny framework for line-based interactive services: one command table, served over stdio or TCP."
readme = "../../README.md"
keywords = ["repl", "tcp", "interactive", "ctf", "cli"]
categories = ["command-line-interface", "network-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["net", "macros"]
# Connection server over TCP or Unix sockets, and `--listen` in `banter::run`.
net = []
# `#[banter::commands]` and `#[derive(FromArg)]`.
macros = ["dep:banter-macros"]
# ANSI styling with palettes.
style = []
# Proof-of-work gate over SHA-256.
pow = ["dep:sha2"]
# In-memory scripts and an interactive test client.
testing = []
full = ["net", "macros", "style", "pow", "testing"]

[dependencies]
banter-macros = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
banter = { workspace = true, features = ["full"] }

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "guess"

[[example]]
name = "vault"
required-features = ["style", "pow"]
