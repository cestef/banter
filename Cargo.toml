[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["cstef <hi@cstef.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cestef/banter"

[workspace.dependencies]
banter = { path = "crates/banter", version = "0.1.0" }
banter-macros = { path = "crates/banter-macros", version = "0.1.0" }
sha2 = { version = "0.10", default-features = false }
unsynn = { version = "0.3", default-features = false, features = ["proc_macro2"] }
